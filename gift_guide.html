const budgetLabels = {
  "500-1000":"NT$500–1,000",
  "1001-2000":"NT$1,001–2,000",
  "2001-5000":"NT$2,001–5,000",
  "5001-8000":"NT$5,001–8,000",
  "8000+":"NT$8,000 以上"
};
let selectedOccasion = "生日";
let selectedRecipient = "女生";
let selectedBudget = "1001-2000";

function setActive(containerId, value){
  document.querySelectorAll(`#${containerId} .choice`).forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.value === value);
  });
}
function render(){
  const needsRecipient = ["生日","情人節"].includes(selectedOccasion);
  document.getElementById("recipientBlock").classList.toggle("hidden", !needsRecipient);
  document.getElementById("budgetStep").textContent = needsRecipient
    ? "STEP 03｜選擇送禮預算" : "STEP 02｜選擇送禮預算";
  document.getElementById("filterSummary").textContent =
    `${selectedOccasion}${needsRecipient ? "・送"+selectedRecipient : ""}・${budgetLabels[selectedBudget]}`;
  const matched = products.filter(p =>
    p.occasions.includes(selectedOccasion) &&
    (!needsRecipient || p.recipients.includes("全部") || p.recipients.includes(selectedRecipient)) &&
    p.budgets.includes(selectedBudget)
  );
  const grid = document.getElementById("productGrid");
  grid.innerHTML = "";
  document.getElementById("resultCount").textContent = `找到 ${matched.length} 件推薦`;
  document.getElementById("emptyState").classList.toggle("hidden", matched.length !== 0);
  matched.forEach(p=>{
    const card = document.createElement("article");
    card.className = "product";
    const top = document.createElement("div"); top.className = "product-top";
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = selectedOccasion;
    top.appendChild(tag);
    const title = document.createElement("h3"); title.textContent = p.name;
    const desc = document.createElement("p"); desc.textContent = p.description;
    const price = document.createElement("div"); price.className = "price";
    price.textContent = "NT$" + p.price.toLocaleString("zh-TW");
    const link = document.createElement("a"); link.className = "btn";
    link.textContent = p.buttonText || "前往蝦皮選購 →";
    link.href = p.affiliateUrl;
    link.target = "_blank"; link.rel = "sponsored nofollow noopener";
    card.append(top,title,desc,price,link); grid.appendChild(card);
  });
}
document.querySelectorAll("#occasionChoices .choice").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedOccasion = btn.dataset.value;
    setActive("occasionChoices",selectedOccasion);
    render();
  });
});
document.querySelectorAll("#recipientChoices .choice").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedRecipient = btn.dataset.value;
    setActive("recipientChoices",selectedRecipient);
    render();
  });
});
document.querySelectorAll("#budgetChoices .choice").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedBudget = btn.dataset.value;
    setActive("budgetChoices",selectedBudget);
    render();
  });
});
render();
